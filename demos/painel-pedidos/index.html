<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel de Pedidos — demonstração | Duvyx Tech</title>
<meta name="description" content="Projeto demonstrativo: controle de pedidos por etapas com exportação CSV.">
<meta name="robots" content="noindex">
<link rel="icon" href="../../assets/favicon/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<link rel="stylesheet" href="../demo-bar.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="demo-bar" role="note"><span><strong>Projeto demonstrativo</strong> · pedidos fictícios · tudo fica salvo só neste navegador</span><a href="../../portfolio/painel-pedidos.html">Voltar ao estudo de caso</a></div>

<header class="top">
  <div><h1>Painel de Pedidos</h1><p class="sub">Ateliê de bolos e doces (fictício)</p></div>
  <div class="tools">
    <label class="sr" for="busca">Buscar pedidos</label>
    <input id="busca" type="search" placeholder="Buscar cliente ou item">
    <button type="button" class="btn" id="abrir-novo" aria-expanded="false" aria-controls="novo">+ Novo pedido</button>
    <button type="button" class="btn ghost" id="exportar">Exportar CSV</button>
    <label class="btn ghost file">Importar CSV<input type="file" id="importar" accept=".csv,text/csv"></label>
    <button type="button" class="btn ghost" id="exemplo">Restaurar exemplo</button>
  </div>
</header>

<form id="novo" class="novo" hidden novalidate>
  <label>Cliente<input name="cliente" required autocomplete="off"></label>
  <label>Item<input name="item" required autocomplete="off" placeholder="Ex.: Bolo de cenoura 1 kg"></label>
  <label>Valor (R$)<input name="valor" type="number" min="0" step="0.01" required></label>
  <label>Entrega<input name="entrega" type="date" required></label>
  <div class="form-actions"><button class="btn" type="submit">Adicionar</button><button class="btn ghost" type="button" id="cancelar">Cancelar</button></div>
  <p class="erro" id="erro" role="alert"></p>
</form>

<p id="msg" class="msg" role="status" aria-live="polite"></p>
<main class="board" id="board" aria-label="Quadro de pedidos"></main>
<script src="app.js"></script>
</body>
</html>
